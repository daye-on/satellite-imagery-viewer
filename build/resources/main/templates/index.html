<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#">
    <title>Test Viewer</title>

    <!-- Required -->
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <link href="/tailwindcss/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="/leaflet/leaflet.css">
    <script type="text/javascript" src="/leaflet/leaflet.js"></script>
    <link rel="stylesheet" href="/leaflet-awesome-markers/leaflet.awesome-markers.css">
    <script src="/leaflet-awesome-markers/leaflet.awesome-markers.js"></script>

    <!-- Calendar -->
    <script type="text/javascript" src="/daterangepicker/moment.min.js"></script>
    <script type="text/javascript" src="/daterangepicker/daterangepicker.js"></script>
    <link rel="stylesheet" type="text/css" href="/daterangepicker/daterangepicker.css"/>

    <!-- Custom -->
    <script type="text/javascript" src="/custom/common.js"></script>
    <link rel="stylesheet" type="text/css" href="/custom/common.css"/>
    <script type="text/javascript" src="/custom/colorBar.js"></script>
    <script type="text/javascript" src="/custom/timeSlider.js"></script>

</head>
<body>
<div id="map"></div>
<script>
    const map = createLeafletMap()

    function getLeafletCustom(){
        // 데이터 리스트
        const customLayer = L.control();
        customLayer.onAdd = () => {
            const customDiv = L.DomUtil.create('div');
            customDiv.id = "layer-dataList"
            return customDiv;
        }
        customLayer.addTo(map);
        const dataList = document.getElementById("layer-dataList");
        dataList.insertAdjacentHTML("afterbegin", getDataList());

        // 컬러바
        const customColorbar = L.control({ position: "bottomright" });
        customColorbar.onAdd = () => {
            const colorbarDiv = L.DomUtil.create("div", "colorbar-wrapper");
            colorbarDiv.innerHTML = `
            <canvas class="colorbar" id="colorbar_chl" width="200px" height="300px" style="display: none;"></canvas>
            <canvas class="colorbar" id="colorbar_sst" width="200px" height="300px" style="display: none;"></canvas>
        `
            return colorbarDiv
        }
        customColorbar.addTo(map)

        let customContainer1 = customLayer.getContainer();
        L.DomEvent.disableClickPropagation(customContainer1);
        L.DomEvent.disableScrollPropagation(customContainer1);
        let customContainer2 = customColorbar.getContainer();
        L.DomEvent.disableClickPropagation(customContainer2);
        L.DomEvent.disableScrollPropagation(customContainer2);
    }

    function getDataList(){
        return `
        <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-4 pb-3 pt-4">
            <div class="flex flex-col gap-2 mb-4">
                <div style="display: flex; justify-content: space-between;">
                    <h3 class="text-lg font-semibold text-gray-800">단일 이미지 출력</h3>
                    <button id="data_toggle">▲</button>
                </div>
                <div>
                    <span>이미지의 특정 좌표를 클릭하면, 데이터 값이 출력됩니다.</span><br>
                    <span id="image_name"></span>
                </div>
            </div>

            <div class="data-table" id="data_table">
                <div class="flex items-center gap-3 pb-5">
                    <input type="button" class="item-selected inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50 focus:bg-gray-300 hover:text-gray-800"
                        value="All"/>
                    <input type="button" class="item-selected inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50 focus:bg-gray-300 hover:text-gray-800"
                        value="Chl-A"/>
                    <input type="button" class="item-selected inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50 focus:bg-gray-300 hover:text-gray-800"
                        value="SST"/>
                    <input type="button" class="item-selected inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50 focus:bg-gray-300 hover:text-gray-800"
                        value="" id="calendar"/>
                </div>
                <div class="w-full overflow-x-auto custom-height">
                    <table class="min-w-full">
                        <tbody id="data_body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>`
    }

    // DateRangePicker custom
    function getDataCalendar(id){

        // 초기 세팅
        let calendarId = "#"+id
        const $picker = $(calendarId).daterangepicker({
            opens: "left",
            locale: {format: "YYYY/MM/DD", cancelLabel: "Clear"},
            startDate: moment().subtract(7, "days"),
            endDate: moment()
        })

        let pickerObj = $picker.data("daterangepicker");
        let initStart = pickerObj.startDate.format("YYYY/MM/DD");
        let initEnd = pickerObj.endDate.format("YYYY/MM/DD");
        document.querySelector("#data_body").innerHTML = getApiDataRange(initStart, initEnd);

        $(calendarId).on('cancel.daterangepicker', function(ev, picker) {
            $(this).val(initStart + ' - ' + initEnd);
            document.querySelector("#data_body").innerHTML = getApiDataRange(initStart, initEnd);
        });

        $(calendarId).on('apply.daterangepicker', function(ev, picker) {
            start_date = picker.startDate.format('YYYY/MM/DD');
            end_date = picker.endDate.format('YYYY/MM/DD');
            $(this).val( start_date + ' - ' + end_date);
            document.querySelector("#data_body").innerHTML = getApiDataRange(start_date, end_date);
        });
    }

    // 원하는 기간의 자료 호출
    function getApiDataRange(start_date, end_date){
        resetImageLayer();

        let requestParam = {
            "start_date": start_date,
            "end_date": end_date,
            "data_type": "all"
        }

        let uiResult = ``;
        $.ajax({
            type: "POST",
            url: "/api/range",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify(requestParam),
            async: false,
            success : function(res){
                uiResult = getDataBodyUI(res)
                 $("#image_name").text("")
            }
        })

        return uiResult
    }

    function getDataBodyUI(res){
        let uiResult = ``;

        if (res.count === 0) {
            uiResult = `Not Found`
            return uiResult
        }

        let objects = res.objects;
        for(let i=0; i<objects.length; i++){
            let filename = objects[i].FileName;
            let item = filename.split('/')[0];
            if(item === 'all')
                continue

            let data = filename.split('/')[1];
            data = data.replace('_web.png', '')
            data = data.split("_").pop()

            let oneData = `
                <tr class="datalist `+item+`">
                    <td class="py-3 flex items-center gap-3">
                        <input type="checkbox" class="data-selected" id="`+filename+`" value="`+filename+`" hidden>
                        <label class="font-medium text-gray-800 text-xs hover:text-red-500" for="`+filename+`">
                            `+data+`
                        </label>
                        <button type="button" class="bi bi-download" id="data_download" value="`+filename+`"></button>
                    </td>
                </tr>
                `
            uiResult += oneData
        }

        return uiResult;
    }

    // 데이터 항목 별 리스트 출력
    function selectItem(selected){
        let dataListAll = document.getElementsByClassName("datalist");
        for (let i=0; i<dataListAll.length; i++) {
            let className = dataListAll[i].className;
            if(className.endsWith(selected)){
                dataListAll[i].style.display = 'block';
            } else {
                dataListAll[i].style.display = 'none';
            }

        }
    }

    function getImageOverlay(pngName){
        let imgUrl = apiUrl+"/"+pngName;
        L.imageOverlay(imgUrl, latLngBounds, {
            opacity: 1,
            interactive: true
        }).addTo(map)
    }

    $(document).ready(function() {
        getTafiriMenu()
        getLeafletCustom()
        getDataCalendar("calendar")
        getTableUIToggle("data_table", "data_toggle")

        $(document).on("click", ".item-selected", function(e){
            let item = e.target.value;
            if (item === 'Chl-A') selectItem('chl');
            else if (item === 'SST') selectItem('sst');
            else selectItem('');
        })

        $(document).on("click", ".data-selected", function(e){
            let pngName = e.target.value;
            let name = pngName.split('/')[1];
            name = name.replace('_web.png', '')
            name = name.split("_").pop()
            $("#image_name").text(name)

            resetImageLayer();
            getImageOverlay(pngName);
        })
    })
</script>
</body>
</html>
